<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0c13"/>
<title>Budget · Pathed</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c13; min-height: 100%; }
  #root { min-height: 100vh; }

  input, textarea, select {
    font-size: 16px !important;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const STORAGE_KEY = "budget-planner-v2";

const CATEGORIES = [
  "Housing","Utilities","Groceries","Transport","Subscriptions",
  "Dining & Takeaway","Health & Fitness","Personal Care","Clothing",
  "Entertainment","Insurance","Loans & Finance","Savings","Gifts","Other"
];

const CAT_ICON = {
  "Housing":"🏠","Utilities":"⚡","Groceries":"🛒","Transport":"🚗",
  "Subscriptions":"📱","Dining & Takeaway":"🍽️","Health & Fitness":"💪",
  "Personal Care":"🧴","Clothing":"👗","Entertainment":"🎬",
  "Insurance":"🛡️","Loans & Finance":"🏦","Savings":"💎","Gifts":"🎁","Other":"📦"
};

const CAT_COLOR = [
  "#6c8ef5","#f5a66c","#5af5a6","#f56c6c","#c46cf5",
  "#f5d76c","#6cf5e8","#f56ca8","#a8f56c","#6caef5",
  "#f5906c","#6cf5b8","#b8f56c","#f56ce0","#8890a8"
];

const fmt = n => `£${Math.abs(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const today = () => new Date().toISOString().split("T")[0];
const daysUntil = dateStr => {
  if (!dateStr) return null;
  const diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / (1000*60*60*24));
};

const defaultState = {
  openingBalance: 0,
  salaryAmount: 0,
  nextPayDate: "",
  salarySetup: false,
  salaryOverride: null,       // one-off override amount
  salaryOverrideMonth: null,  // "YYYY-MM" string — auto-clears when month changes
  lastResetDate: null,        // ISO date string of last auto-reset
  income: [],
  expenses: [],
};

const { useState, useEffect, useMemo, useRef } = React;

// ─── ICONS (inline SVG) ───────────────────────────────────────
const Icon = ({ name, size=18, color="currentColor" }) => {
  const paths = {
    home: "M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10",
    list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
    plus: "M12 5v14M5 12h14",
    settings: "M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z",
    check: "M20 6L9 17l-5-5",
    x: "M18 6L6 18M6 6l12 12",
    edit: "M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7 M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z",
    trash: "M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6",
    income: "M12 2v20M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6",
    calendar: "M3 4h18v18H3zM16 2v4M8 2v4M3 10h18",
    alert: "M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01",
    sun: "M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42",
    chart: "M3 3v18h18 M7 14l4-4 3 3 5-6",
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
      {(paths[name]||"").split(" M").map((d,i)=>(
        <path key={i} d={(i===0?d:"M"+d)} />
      ))}
    </svg>
  );
};

// ─── MAIN APP ─────────────────────────────────────────────────
function BudgetPlanner() {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("dashboard");
  const [modal, setModal] = useState(null); // null | {type:'income'|'expense'|'setup', data?}
  const [toast, setToast] = useState(null);
  const [expFilter, setExpFilter] = useState("All");
  const toastTimer = useRef(null);

  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      setState(saved ? JSON.parse(saved) : defaultState);
    } catch { setState(defaultState); }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded || !state) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }, [state, loaded]);

  // ─── AUTO-RESET ON PAYDAY ──────────────────────────────────
  // When today is on or after the next pay date, and we haven't already reset
  // for this pay cycle, automatically:
  //   1. Reset all expenses to unpaid
  //   2. Advance nextPayDate by one month
  //   3. Clear one-off income entries (keep recurring ones)
  //   4. Record the reset date so we don't reset again this cycle
  useEffect(() => {
    if (!loaded || !state || !state.nextPayDate) return;
    const today = new Date();
    today.setHours(0,0,0,0);
    const payDate = new Date(state.nextPayDate);
    payDate.setHours(0,0,0,0);
    if (today < payDate) return; // not payday yet

    // Check if we already reset for this pay cycle
    if (state.lastResetDate) {
      const lastReset = new Date(state.lastResetDate);
      lastReset.setHours(0,0,0,0);
      if (lastReset >= payDate) return; // already reset this cycle
    }

    // Advance pay date by one month (keep same day of month)
    const nextPay = new Date(payDate);
    nextPay.setMonth(nextPay.getMonth() + 1);
    const nextPayStr = nextPay.toISOString().split("T")[0];

    // Reset all expenses to unpaid, advance their dates by one month too
    const resetExpenses = state.expenses.map(e => {
      const newDate = new Date(e.date || state.nextPayDate);
      newDate.setMonth(newDate.getMonth() + 1);
      return { ...e, paid: false, date: newDate.toISOString().split("T")[0] };
    });

    // Keep only recurring income (remove one-off entries that have passed)
    const resetIncome = state.income.filter(i => i.recurring);

    upd(() => ({
      expenses: resetExpenses,
      income: resetIncome,
      nextPayDate: nextPayStr,
      lastResetDate: today.toISOString().split("T")[0],
      salaryOverride: null,
      salaryOverrideMonth: null,
    }));

    showToast("New pay period started — expenses reset ✓");
  }, [loaded, state?.nextPayDate]);

  const showToast = (msg, type="ok") => {
    clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  };

  const upd = fn => setState(p => ({ ...p, ...fn(p) }));

  // ─── CALCULATIONS ──────────────────────────────────────────
  const calc = useMemo(() => {
    if (!state) return {};
    const now = new Date();
    const cm = now.getMonth(), cy = now.getFullYear();

    // Additional income (non-salary)
    const additionalIncome = state.income.reduce((s,i) => s + Number(i.amount), 0);

    // Use override salary if set for this month, otherwise use the regular amount
    const currentMonthKey = `${cy}-${String(cm+1).padStart(2,'0')}`;
    const salaryOverrideActive = state.salaryOverrideMonth === currentMonthKey && state.salaryOverride !== null;
    const salary = salaryOverrideActive ? Number(state.salaryOverride) : Number(state.salaryAmount || 0);

    // This month expenses
    const monthExp = state.expenses.filter(e => {
      if (e.recurring) return true;
      const d = new Date(e.date);
      return d.getMonth()===cm && d.getFullYear()===cy;
    });

    const totalExp = monthExp.reduce((s,e) => s+Number(e.amount), 0);
    const paidAmt = state.expenses.filter(e=>e.paid).reduce((s,e)=>s+Number(e.amount),0);

    // Current balance = exactly what the user sets — never modified by the app
    const liveBalance = Number(state.openingBalance);

    // Forecast = current balance
    //   - unpaid expenses dated on or before next pay date
    //   + additional income dated on or before next pay date
    // Everything with a date after pay date is excluded — it's next period's problem
    const beforePayday = (dateStr) => {
      if (!payDate) return true; // no pay date set — include everything
      return new Date(dateStr) <= payDate;
    };

    const unpaidExpBeforePayday = state.expenses
      .filter(e => !e.paid && beforePayday(e.date || today()))
      .reduce((s, e) => s + Number(e.amount), 0);

    const incomeBeforePayday = state.income
      .filter(i => beforePayday(i.date || today()))
      .reduce((s, i) => s + Number(i.amount), 0);

    const forecastEnd = Number(state.openingBalance) - unpaidExpBeforePayday + incomeBeforePayday;

    // Next month opening = forecast + salary landing on pay date
    const nextOpening = forecastEnd + salary;

    // Also keep unpaidExp for the month summary display
    const unpaidExp = monthExp.filter(e=>!e.paid).reduce((s,e)=>s+Number(e.amount),0);

    // Due before payday
    const payDate = state.nextPayDate ? new Date(state.nextPayDate) : null;
    const dueBefore = payDate ? state.expenses.filter(e => {
      if (e.paid) return false;
      if (e.recurring) return true;
      return new Date(e.date) <= payDate;
    }) : state.expenses.filter(e => !e.paid);
    const dueTotal = dueBefore.reduce((s,e)=>s+Number(e.amount),0);

    // Daily budget remaining
    const days = daysUntil(state.nextPayDate);
    const dailyBudget = days && days > 0 ? liveBalance / days : null;

    // By category
    const byCat = {};
    monthExp.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Number(e.amount); });
    const catList = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

    return {
      salary, additionalIncome,
      salaryOverrideActive,
      currentMonthKey,
      totalIncome: salary + additionalIncome,
      totalExp, paidAmt, liveBalance,
      forecastEnd, nextOpening,
      dueBefore, dueTotal,
      days, dailyBudget,
      byCat, catList,
      recurringTotal: monthExp.filter(e=>e.recurring).reduce((s,e)=>s+Number(e.amount),0),
      oneOffTotal: monthExp.filter(e=>!e.recurring).reduce((s,e)=>s+Number(e.amount),0),
    };
  }, [state]);

  if (!loaded || !state) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0a0c13",color:"#fff",fontFamily:"monospace",fontSize:14}}>
      Loading…
    </div>
  );

  // First-time setup
  if (!state.salarySetup) return (
    <Setup onDone={data => { upd(()=>({...data, salarySetup:true})); }} />
  );

  return (
    <div style={{minHeight:"100vh",background:"#0a0c13",color:"#dde1f0",fontFamily:"'DM Sans',sans-serif",paddingBottom:80}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
      <GlobalStyles/>

      {/* ── TOP BAR ── */}
      <div style={{background:"#0d0f19",borderBottom:"1px solid #1c1f30",padding:"0 20px",height:54,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{fontFamily:"Instrument Serif, serif",fontSize:20,color:"#6c8ef5",letterSpacing:-0.3}}>
          Budget
        </div>
        {calc.days !== null && calc.days >= 0 && (
          <div style={{background:"#1c1f30",border:"1px solid #2a2e45",borderRadius:20,padding:"4px 12px",fontSize:12,color:"#8890a8",display:"flex",alignItems:"center",gap:6}}>
            <Icon name="calendar" size={12} color="#6c8ef5"/>
            <span style={{color:"#6c8ef5",fontWeight:600}}>{calc.days}d</span>
            <span>until payday</span>
          </div>
        )}
        <button className="icon-btn" onClick={()=>setView("settings")}>
          <Icon name="settings" size={18} color={view==="settings"?"#6c8ef5":"#8890a8"}/>
        </button>
      </div>

      {/* ── CONTENT ── */}
      <div style={{maxWidth:600,margin:"0 auto",padding:"20px 16px"}}>

        {view==="dashboard" && <Dashboard state={state} calc={calc} setModal={setModal} setView={setView} upd={upd} showToast={showToast}/>}
        {view==="expenses" && <Expenses state={state} upd={upd} calc={calc} setModal={setModal} showToast={showToast} expFilter={expFilter} setExpFilter={setExpFilter}/>}
        {view==="income" && <IncomeView state={state} upd={upd} calc={calc} setModal={setModal} showToast={showToast}/>}
        {view==="analytics" && <Analytics state={state} calc={calc}/>}
        {view==="settings" && <Settings state={state} upd={upd} showToast={showToast}/>}

      </div>

      {/* ── BOTTOM NAV ── */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0d0f19",borderTop:"1px solid #1c1f30",display:"flex",zIndex:50,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {[
          {id:"dashboard",icon:"home",label:"Home"},
          {id:"expenses",icon:"list",label:"Expenses"},
          {id:"income",icon:"income",label:"Income"},
          {id:"analytics",icon:"chart",label:"Trends"},
        ].map(tab=>(
          <button key={tab.id} onClick={()=>setView(tab.id)}
            style={{flex:1,background:"none",border:"none",padding:"12px 8px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer",color:view===tab.id?"#6c8ef5":"#555a72",transition:"color 0.15s"}}>
            <Icon name={tab.icon} size={20} color={view===tab.id?"#6c8ef5":"#555a72"}/>
            <span style={{fontSize:10,fontWeight:600,letterSpacing:0.3}}>{tab.label}</span>
            {view===tab.id && <div style={{position:"absolute",bottom:0,width:40,height:2,background:"#6c8ef5",borderRadius:1}}/>}
          </button>
        ))}
      </div>

      {/* ── FAB ── */}
      {view==="expenses" && (
        <button onClick={()=>setModal({type:"expense"})}
          style={{position:"fixed",bottom:76,right:20,width:52,height:52,borderRadius:"50%",background:"#6c8ef5",border:"none",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(108,142,245,0.4)",zIndex:49,cursor:"pointer",transition:"transform 0.15s"}}
          onMouseOver={e=>e.currentTarget.style.transform="scale(1.08)"}
          onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
          <Icon name="plus" size={24} color="#fff"/>
        </button>
      )}
      {view==="income" && (
        <button onClick={()=>setModal({type:"income"})}
          style={{position:"fixed",bottom:76,right:20,width:52,height:52,borderRadius:"50%",background:"#5af5a6",border:"none",color:"#0a0c13",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 20px rgba(90,245,166,0.35)",zIndex:49,cursor:"pointer",transition:"transform 0.15s"}}
          onMouseOver={e=>e.currentTarget.style.transform="scale(1.08)"}
          onMouseOut={e=>e.currentTarget.style.transform="scale(1)"}>
          <Icon name="plus" size={24} color="#0a0c13"/>
        </button>
      )}

      {/* ── MODALS ── */}
      {modal?.type==="expense" && (
        <ExpenseModal expense={modal.data}
          onSave={exp=>{
            if(modal.data){ upd(p=>({expenses:p.expenses.map(e=>e.id===exp.id?exp:e)})); showToast("Expense updated"); }
            else { upd(p=>({expenses:[...p.expenses,{...exp,id:Date.now()}]})); showToast("Expense logged ✓"); }
            setModal(null);
          }}
          onClose={()=>setModal(null)}/>
      )}
      {modal?.type==="income" && (
        <IncomeModal income={modal.data}
          onSave={inc=>{
            if(inc.isSalary){ upd(()=>({salaryAmount:parseFloat(inc.amount)||0})); showToast("Salary updated ✓"); }
            else if(modal.data){ upd(p=>({income:p.income.map(i=>i.id===inc.id?inc:i)})); showToast("Income updated"); }
            else { upd(p=>({income:[...p.income,{...inc,id:Date.now()}]})); showToast("Income added ✓"); }
            setModal(null);
          }}
          onClose={()=>setModal(null)}/>
      )}

      {/* ── TOAST ── */}
      {toast && (
        <div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:toast.type==="err"?"#3a1a1a":"#1c1f30",border:`1px solid ${toast.type==="err"?"#e85a5a44":"#2a2e45"}`,color:"#dde1f0",padding:"11px 22px",borderRadius:10,fontSize:13,fontWeight:500,zIndex:200,whiteSpace:"nowrap",animation:"fadeUp 0.25s ease",pointerEvents:"none"}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ─── SETUP ────────────────────────────────────────────────────
function Setup({ onDone }) {
  const [salary, setSalary] = useState("");
  const [balance, setBalance] = useState("");
  const [payDate, setPayDate] = useState("");

  return (
    <div style={{minHeight:"100vh",background:"#0a0c13",display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'DM Sans',sans-serif"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
      <GlobalStyles/>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{fontFamily:"Instrument Serif,serif",fontSize:36,color:"#6c8ef5",marginBottom:8,lineHeight:1.1}}>
          Let's set up<br/><em>your budget.</em>
        </div>
        <p style={{color:"#8890a8",fontSize:14,marginBottom:32,lineHeight:1.6}}>Three quick things and you're good to go.</p>

        <div style={{display:"flex",flexDirection:"column",gap:20}}>
          <Field label="What's in your account right now? (£)" icon="💳">
            <input type="number" step="0.01" placeholder="e.g. 842.50" value={balance} onChange={e=>setBalance(e.target.value)}/>
          </Field>
          <Field label="Monthly salary (£)" icon="💰">
            <input type="number" step="0.01" placeholder="e.g. 2800.00" value={salary} onChange={e=>setSalary(e.target.value)}/>
          </Field>
          <Field label="Next pay date" icon="📅">
            <input type="date" value={payDate} onChange={e=>setPayDate(e.target.value)}/>
          </Field>
        </div>

        <button
          onClick={()=>{
            if(!balance||!salary) return;
            onDone({ openingBalance:parseFloat(balance)||0, salaryAmount:parseFloat(salary)||0, nextPayDate:payDate, income:[], expenses:[] });
          }}
          style={{marginTop:32,width:"100%",background:"#6c8ef5",color:"#fff",border:"none",borderRadius:12,padding:"15px",fontSize:16,fontWeight:600,cursor:"pointer"}}>
          Start tracking →
        </button>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────
function Dashboard({ state, calc, setModal, setView, upd, showToast }) {
  const [editingBalance, setEditingBalance] = React.useState(false);
  const [balanceDraft, setBalanceDraft] = React.useState("");

  const startEdit = () => {
    setBalanceDraft(state.openingBalance.toString());
    setEditingBalance(true);
  };

  const saveBalance = () => {
    const val = parseFloat(balanceDraft);
    if (!isNaN(val)) {
      upd(() => ({ openingBalance: val }));
      showToast("Balance updated ✓");
    }
    setEditingBalance(false);
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter") saveBalance();
    if (e.key === "Escape") setEditingBalance(false);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* Hero balance */}
      <div style={{background:"linear-gradient(135deg,#13162280,#1c1f3280)",border:"1px solid #1c1f30",borderRadius:20,padding:"24px 24px 20px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:12,fontWeight:600,color:"#8890a8",letterSpacing:1,textTransform:"uppercase"}}>Current Balance</div>
          {!editingBalance && (
            <button onClick={startEdit}
              style={{background:"#1c1f30",border:"1px solid #2a2e45",borderRadius:8,padding:"5px 12px",color:"#8890a8",fontSize:12,fontWeight:500,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6,transition:"all 0.15s"}}
              onMouseOver={e=>{e.currentTarget.style.borderColor="#6c8ef5";e.currentTarget.style.color="#6c8ef5";}}
              onMouseOut={e=>{e.currentTarget.style.borderColor="#2a2e45";e.currentTarget.style.color="#8890a8";}}>
              <Icon name="edit" size={12} color="currentColor"/> Update
            </button>
          )}
        </div>

        {editingBalance ? (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:12,color:"#8890a8",marginBottom:8}}>Enter your current account balance:</div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",flex:1,background:"#1c1f30",border:"1px solid #2a2e45",borderRadius:8,height:56,paddingLeft:14}}>
                <span style={{color:"#8890a8",fontSize:24,fontFamily:"Instrument Serif,serif",lineHeight:1,flexShrink:0,marginRight:4}}>£</span>

// ─── EXPENSES VIEW ────────────────────────────────────────────
function Expenses({ state, upd, calc, setModal, showToast, expFilter, setExpFilter }) {
  const filters = ["All","Recurring","One-off","Paid","Unpaid"];

  const filtered = state.expenses.filter(e=>{
    if(expFilter==="Recurring") return e.recurring;
    if(expFilter==="One-off") return !e.recurring;
    if(expFilter==="Paid") return e.paid;
    if(expFilter==="Unpaid") return !e.paid;
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const filteredTotal = filtered.reduce((s,e)=>s+Number(e.amount),0);

  return (
    <div>
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:28,marginBottom:16}}>Expenses</div>

      {/* Filter chips */}
      <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4,marginBottom:16,scrollbarWidth:"none"}}>
        {filters.map(f=>(
          <button key={f} onClick={()=>setExpFilter(f)}
            style={{background:expFilter===f?"#6c8ef5":"#1c1f30",color:expFilter===f?"#fff":"#8890a8",border:"none",borderRadius:20,padding:"7px 16px",fontSize:13,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,transition:"all 0.15s"}}>
            {f}
          </button>
        ))}
      </div>

      {/* Running total */}
      {filtered.length>0&&(
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:"#1c1f30",borderRadius:10,marginBottom:14,fontSize:13}}>
          <span style={{color:"#8890a8"}}>{filtered.length} expense{filtered.length!==1?"s":""}</span>
          <span style={{fontWeight:700,color:"#e85a5a"}}>-{fmt(filteredTotal)}</span>
        </div>
      )}

      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"48px 0",color:"#555a72"}}>
          <div style={{fontSize:36,marginBottom:12}}>📋</div>
          <div style={{fontSize:14}}>{state.expenses.length===0?"No expenses yet. Tap + to log one.":"No expenses match this filter."}</div>
        </div>
      ):(
        <div style={{background:"#13162280",border:"1px solid #1c1f30",borderRadius:16,overflow:"hidden"}}>
          {filtered.map((e,i)=>(
            <ExpRow key={e.id} e={e} last={i===filtered.length-1}
              onTogglePaid={()=>{
                upd(p=>({expenses:p.expenses.map(ex=>ex.id===e.id?{...ex,paid:!ex.paid}:ex)}));
                showToast(e.paid?"Marked unpaid":"Marked as paid ✓");
              }}
              onEdit={()=>setModal({type:"expense",data:e})}
              onDelete={()=>{ upd(p=>({expenses:p.expenses.filter(ex=>ex.id!==e.id)})); showToast("Removed"); }}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// ─── SETTINGS ─────────────────────────────────────────────────
// ─── ANALYTICS: 60-DAY BALANCE PROJECTION ─────────────────────
function Analytics({ state, calc }) {
  const fmt = n => "£" + Number(n).toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:0});
  const fmtFull = n => "£" + Number(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});

  // Build the 60-day projection
  const projection = React.useMemo(() => {
    const DAYS = 60;
    const start = new Date(); start.setHours(0,0,0,0);
    let balance = Number(state.openingBalance) || 0;

    // Helper: day-of-month for recurring items
    const dom = (dateStr) => {
      if (!dateStr) return 1;
      return new Date(dateStr).getDate();
    };

    // Salary: lands on nextPayDate, then monthly after
    const payDay = state.nextPayDate ? new Date(state.nextPayDate).getDate() : null;
    const salaryAmt = Number(state.salaryAmount) || 0;

    const points = [];
    for (let i = 0; i <= DAYS; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const thisDOM = d.getDate();

      const events = []; // money movements on this exact day
      if (i > 0) {
        // Expenses due this day (recurring = match day-of-month; one-off = match exact date)
        state.expenses.forEach(e => {
          const amt = Number(e.amount) || 0;
          let hit = false;
          if (e.recurring) {
            if (dom(e.date) === thisDOM) hit = true;
          } else {
            const ed = new Date(e.date); ed.setHours(0,0,0,0);
            if (ed.getTime() === d.getTime() && !e.paid) hit = true;
          }
          if (hit) { balance -= amt; events.push({ kind:"expense", label:e.company||e.category||"Expense", amount:-amt, recurring:e.recurring }); }
        });
        // Additional income
        state.income.forEach(inc => {
          const amt = Number(inc.amount) || 0;
          let hit = false;
          if (inc.recurring) {
            if (dom(inc.date) === thisDOM) hit = true;
          } else {
            const id = new Date(inc.date); id.setHours(0,0,0,0);
            if (id.getTime() === d.getTime()) hit = true;
          }
          if (hit) { balance += amt; events.push({ kind:"income", label:inc.label||"Income", amount:amt, recurring:inc.recurring }); }
        });
        // Salary
        if (payDay && thisDOM === payDay && salaryAmt > 0) { balance += salaryAmt; events.push({ kind:"salary", label:"Salary", amount:salaryAmt, recurring:true }); }
      }

      points.push({
        date: new Date(d),
        balance: Math.round(balance * 100) / 100,
        label: d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
        events,
      });
    }
    return points;
  }, [state]);

  const balances = projection.map(p => p.balance);
  const minBal = Math.min(...balances, 0);
  const maxBal = Math.max(...balances, 500);
  const range = maxBal - minBal || 1;

  // Zone colour for a balance
  const zoneColor = (b) => b < 100 ? "#e85a5a" : b < 500 ? "#f5a66c" : "#5af5a6";
  const zoneLabel = (b) => b < 100 ? "Low" : b < 500 ? "Caution" : "Healthy";

  // Find key events: lowest point, first time crossing into red/orange
  const lowest = projection.reduce((min,p) => p.balance < min.balance ? p : min, projection[0]);
  const firstRed = projection.find(p => p.balance < 100);
  const firstOrange = projection.find(p => p.balance < 500);

  // Chart dimensions
  const W = Math.max(projection.length * 18, 320);
  const H = 280;
  const padTop = 20, padBottom = 28;
  const chartH = H - padTop - padBottom;
  const yFor = (b) => padTop + chartH - ((b - minBal) / range) * chartH;
  const xFor = (i) => (i / (projection.length - 1)) * (W - 20) + 10;

  // Zone band y-positions
  const y100 = yFor(100);
  const y500 = yFor(500);
  const y0 = yFor(minBal);

  // Build the line path
  const linePath = projection.map((p,i) => `${i===0?"M":"L"}${xFor(i).toFixed(1)},${yFor(p.balance).toFixed(1)}`).join(" ");
  // Area fill under line
  const areaPath = linePath + ` L${xFor(projection.length-1).toFixed(1)},${(padTop+chartH).toFixed(1)} L${xFor(0).toFixed(1)},${(padTop+chartH).toFixed(1)} Z`;

  const scrollRef = React.useRef(null);
  const [selectedDay, setSelectedDay] = React.useState(null);

  return (
    <div>
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:26,marginBottom:4}}>Balance Trend</div>
      <div style={{fontSize:13,color:"#8890a8",marginBottom:20}}>Next 60 days · projected day by day</div>

      {/* Summary cards */}
      <div style={{display:"flex",gap:10,marginBottom:18}}>
        <div style={{flex:1,background:"#13151f",border:"1px solid #1c1f30",borderRadius:12,padding:14}}>
          <div style={{fontSize:10,color:"#8890a8",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600,marginBottom:6}}>Lowest point</div>
          <div style={{fontFamily:"Instrument Serif,serif",fontSize:24,color:zoneColor(lowest.balance)}}>{fmt(lowest.balance)}</div>
          <div style={{fontSize:11,color:"#8890a8",marginTop:2}}>{lowest.label}</div>
        </div>
        <div style={{flex:1,background:"#13151f",border:"1px solid #1c1f30",borderRadius:12,padding:14}}>
          <div style={{fontSize:10,color:"#8890a8",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600,marginBottom:6}}>In 60 days</div>
          <div style={{fontFamily:"Instrument Serif,serif",fontSize:24,color:zoneColor(projection[projection.length-1].balance)}}>{fmt(projection[projection.length-1].balance)}</div>
          <div style={{fontSize:11,color:"#8890a8",marginTop:2}}>{projection[projection.length-1].label}</div>
        </div>
      </div>

      {/* Warnings */}
      {firstRed && (
        <div style={{background:"#e85a5a18",border:"1px solid #e85a5a44",borderRadius:10,padding:"12px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
          <Icon name="alert" size={16} color="#e85a5a"/>
          <div style={{fontSize:13,color:"#e8a5a5"}}>Balance drops below <strong>£100</strong> on <strong>{firstRed.label}</strong></div>
        </div>
      )}
      {!firstRed && firstOrange && (
        <div style={{background:"#f5a66c18",border:"1px solid #f5a66c44",borderRadius:10,padding:"12px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
          <Icon name="alert" size={16} color="#f5a66c"/>
          <div style={{fontSize:13,color:"#f5c6a5"}}>Balance dips into caution zone on <strong>{firstOrange.label}</strong></div>
        </div>
      )}
      {!firstOrange && (
        <div style={{background:"#5af5a618",border:"1px solid #5af5a644",borderRadius:10,padding:"12px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
          <Icon name="check" size={16} color="#5af5a6"/>
          <div style={{fontSize:13,color:"#a5f5c6"}}>Healthy balance throughout the next 60 days</div>
        </div>
      )}

      {/* Zone legend */}
      <div style={{display:"flex",gap:14,marginBottom:14,marginTop:16,fontSize:11,color:"#8890a8"}}>
        <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:3,background:"#5af5a6"}}/>£500+</span>
        <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:3,background:"#f5a66c"}}/>£100–500</span>
        <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:3,background:"#e85a5a"}}/>Below £100</span>
      </div>

      {/* Chart - horizontal scroll */}
      <div ref={scrollRef} style={{overflowX:"auto",background:"#0d0f19",border:"1px solid #1c1f30",borderRadius:12,padding:"8px 0",WebkitOverflowScrolling:"touch"}}>
        <svg width={W} height={H} style={{display:"block"}}>
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#6c8ef5" stopOpacity="0.25"/>
              <stop offset="100%" stopColor="#6c8ef5" stopOpacity="0"/>
            </linearGradient>
          </defs>

          {/* Zone bands */}
          {/* Green zone: above 500 */}
          {y500 > padTop && (
            <rect x="0" y={padTop} width={W} height={Math.max(0,y500-padTop)} fill="#5af5a6" opacity="0.05"/>
          )}
          {/* Orange zone: 100-500 */}
          {y100 > y500 && (
            <rect x="0" y={Math.max(padTop,y500)} width={W} height={Math.max(0,y100-Math.max(padTop,y500))} fill="#f5a66c" opacity="0.06"/>
          )}
          {/* Red zone: below 100 */}
          {(padTop+chartH) > y100 && (
            <rect x="0" y={Math.max(padTop,y100)} width={W} height={Math.max(0,(padTop+chartH)-Math.max(padTop,y100))} fill="#e85a5a" opacity="0.07"/>
          )}

          {/* Zone threshold lines */}
          {y500 >= padTop && y500 <= padTop+chartH && (
            <line x1="0" y1={y500} x2={W} y2={y500} stroke="#5af5a6" strokeOpacity="0.3" strokeDasharray="3,3" strokeWidth="1"/>
          )}
          {y100 >= padTop && y100 <= padTop+chartH && (
            <line x1="0" y1={y100} x2={W} y2={y100} stroke="#e85a5a" strokeOpacity="0.4" strokeDasharray="3,3" strokeWidth="1"/>
          )}
          {/* Zero line */}
          {yFor(0) >= padTop && yFor(0) <= padTop+chartH && (
            <line x1="0" y1={yFor(0)} x2={W} y2={yFor(0)} stroke="#555a72" strokeOpacity="0.5" strokeWidth="1"/>
          )}

          {/* Area + line */}
          <path d={areaPath} fill="url(#areaGrad)"/>
          <path d={linePath} fill="none" stroke="#6c8ef5" strokeWidth="2" strokeLinejoin="round"/>

          {/* Date labels every 10 days */}
          {projection.map((p,i) => {
            if (i!==0 && i!==projection.length-1 && i%10!==0) return null;
            return (
              <text key={"lbl"+i} x={xFor(i)} y={H-10} fontSize="9" fill="#8890a8" textAnchor="middle">{p.date.getDate()}/{p.date.getMonth()+1}</text>
            );
          })}

          {/* Event markers - any day where money moves, tappable */}
          {projection.map((p,i) => {
            if (!p.events || p.events.length===0) return null;
            const hasIncome = p.events.some(e=>e.amount>0);
            const hasExpense = p.events.some(e=>e.amount<0);
            // marker colour: green if net income, red/orange shades for expense, based on resulting balance zone
            const markerFill = hasIncome && !hasExpense ? "#5af5a6" : zoneColor(p.balance);
            const isSel = selectedDay===i;
            return (
              <g key={"ev"+i} onClick={()=>setSelectedDay(isSel?null:i)} style={{cursor:"pointer"}}>
                {/* larger invisible tap target */}
                <circle cx={xFor(i)} cy={yFor(p.balance)} r="14" fill="transparent"/>
                {/* visible marker */}
                <circle cx={xFor(i)} cy={yFor(p.balance)} r={isSel?6:4.5} fill={markerFill} stroke={isSel?"#fff":"#0d0f19"} strokeWidth={isSel?2:1.5}/>
                {/* tiny up/down indicator */}
                {hasIncome && <path d={`M${xFor(i)-2.5},${yFor(p.balance)+1.2} L${xFor(i)},${yFor(p.balance)-1.8} L${xFor(i)+2.5},${yFor(p.balance)+1.2}`} stroke="#0d0f19" strokeWidth="1.2" fill="none"/>}
              </g>
            );
          })}

          {/* Highlight line for selected day */}
          {selectedDay!==null && (
            <line x1={xFor(selectedDay)} y1={padTop} x2={xFor(selectedDay)} y2={padTop+chartH} stroke="#6c8ef5" strokeOpacity="0.4" strokeWidth="1" strokeDasharray="2,2"/>
          )}
        </svg>
      </div>

      {/* Selected day popup */}
      {selectedDay!==null && projection[selectedDay] && (
        <div style={{background:"#13151f",border:"1px solid #2a2e45",borderRadius:12,padding:16,marginTop:12,position:"relative"}}>
          <button onClick={()=>setSelectedDay(null)} style={{position:"absolute",top:12,right:12,background:"#1c1f30",border:"none",borderRadius:8,padding:"5px 7px",cursor:"pointer",display:"flex",alignItems:"center"}}>
            <Icon name="x" size={14} color="#8890a8"/>
          </button>
          <div style={{fontSize:11,color:"#8890a8",textTransform:"uppercase",letterSpacing:0.5,fontWeight:600,marginBottom:4}}>{projection[selectedDay].date.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
          <div style={{fontFamily:"Instrument Serif,serif",fontSize:22,color:zoneColor(projection[selectedDay].balance),marginBottom:12}}>{fmtFull(projection[selectedDay].balance)}</div>
          {projection[selectedDay].events.length===0 ? (
            <div style={{fontSize:13,color:"#8890a8"}}>No money movements this day.</div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {projection[selectedDay].events.map((ev,j)=>(
                <div key={j} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:8,borderBottom:j<projection[selectedDay].events.length-1?"1px solid #1c1f30":"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16}}>{ev.kind==="income"?"💷":ev.kind==="salary"?"💰":"💳"}</span>
                    <div>
                      <div style={{fontSize:14,color:"#e8ecf5"}}>{ev.label}</div>
                      <div style={{fontSize:10,color:"#8890a8"}}>{ev.recurring?"Recurring":"One-off"}</div>
                    </div>
                  </div>
                  <div style={{fontFamily:"Instrument Serif,serif",fontSize:17,color:ev.amount>0?"#5af5a6":"#e85a5a"}}>{ev.amount>0?"+":"−"}{fmtFull(Math.abs(ev.amount))}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      <div style={{fontSize:11,color:"#555a72",textAlign:"center",marginTop:8}}>← scroll to see all 60 days →</div>

      {/* Upcoming events list */}
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:20,marginTop:28,marginBottom:12}}>Key moments</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <EventRow label="Today" value={fmtFull(projection[0].balance)} color={zoneColor(projection[0].balance)} sub={zoneLabel(projection[0].balance)}/>
        <EventRow label={`Lowest · ${lowest.label}`} value={fmtFull(lowest.balance)} color={zoneColor(lowest.balance)} sub={zoneLabel(lowest.balance)}/>
        <EventRow label={`Day 60 · ${projection[projection.length-1].label}`} value={fmtFull(projection[projection.length-1].balance)} color={zoneColor(projection[projection.length-1].balance)} sub={zoneLabel(projection[projection.length-1].balance)}/>
      </div>
      <div style={{height:80}}/>
    </div>
  );
}

function EventRow({ label, value, color, sub }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#13151f",border:"1px solid #1c1f30",borderRadius:10,padding:"13px 16px"}}>
      <div>
        <div style={{fontSize:14,color:"#e8ecf5"}}>{label}</div>
        <div style={{fontSize:11,color,marginTop:2,fontWeight:600}}>{sub}</div>
      </div>
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:20,color}}>{value}</div>
    </div>
  );
}

function Settings({ state, upd, showToast }) {
  return (
    <div>
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:28,marginBottom:20}}>Settings</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <SettingCard title="Current account balance">
          <p style={{fontSize:12,color:"#8890a8",marginBottom:10}}>What's in your account right now — updated at the start of each pay period.</p>
          <input type="number" step="0.01" value={state.openingBalance}
            onChange={e=>upd(()=>({openingBalance:parseFloat(e.target.value)||0}))}/>
        </SettingCard>
        <SettingCard title="Monthly salary (£)">
          <input type="number" step="0.01" value={state.salaryAmount||""}
            onChange={e=>upd(()=>({salaryAmount:parseFloat(e.target.value)||0}))}/>
        </SettingCard>
        <SettingCard title="Next pay date">
          <input type="date" value={state.nextPayDate||""}
            onChange={e=>upd(()=>({nextPayDate:e.target.value}))}/>
        </SettingCard>
        <div style={{background:"#1a0a0a",border:"1px solid #3a1212",borderRadius:16,padding:18}}>
          <div style={{fontWeight:600,color:"#e85a5a",marginBottom:6}}>Danger zone</div>
          <p style={{fontSize:13,color:"#8890a8",marginBottom:14}}>Reset all data including expenses, income and settings.</p>
          <button onClick={()=>{ if(window.confirm("Reset everything? This cannot be undone.")) { setState({...defaultState}); showToast("Reset","err"); } }}
            style={{background:"#3a1212",border:"1px solid #e85a5a44",color:"#e85a5a",borderRadius:8,padding:"10px 18px",fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"inherit"}}>
            Reset all data
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── EXPENSE ROW ──────────────────────────────────────────────
function ExpRow({ e, compact, last, onTogglePaid, onEdit, onDelete }) {
  if (compact) return (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #1c1f30"}}>
      <span style={{fontSize:18}}>{CAT_ICON[e.category]||"📦"}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:500,color:e.paid?"#555a72":"#dde1f0",textDecoration:e.paid?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.company}</div>
        <div style={{fontSize:11,color:"#555a72"}}>{e.category}</div>
      </div>
      <span style={{fontSize:13,fontWeight:600,color:e.paid?"#555a72":"#e85a5a",flexShrink:0}}>-{fmt(e.amount)}</span>
    </div>
  );

  return (
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderBottom:last?"none":"1px solid #1c1f30"}}>
      {/* Paid toggle */}
      <div onClick={onTogglePaid}
        style={{width:22,height:22,borderRadius:6,border:`2px solid ${e.paid?"#5af5a6":"#2a2e45"}`,background:e.paid?"#5af5a6":"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all 0.15s"}}>
        {e.paid&&<Icon name="check" size={12} color="#0a0c13"/>}
      </div>
      <span style={{fontSize:18,flexShrink:0}}>{CAT_ICON[e.category]||"📦"}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:14,fontWeight:500,color:e.paid?"#555a72":"#dde1f0",textDecoration:e.paid?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.company}</div>
        <div style={{fontSize:11,color:"#555a72"}}>
          {e.category} · {new Date(e.date).toLocaleDateString("en-GB")}
          {e.notes&&<span> · {e.notes}</span>}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
        <span style={{fontSize:13,fontWeight:700,color:e.paid?"#555a72":"#e85a5a"}}>-{fmt(e.amount)}</span>
        <span style={{fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:10,background:e.recurring?"#6c8ef522":"#f5a66c22",color:e.recurring?"#6c8ef5":"#f5a66c"}}>{e.recurring?"Recurring":"One-off"}</span>
      </div>
      <div style={{display:"flex",gap:6,flexShrink:0}}>
        <button onClick={onEdit} style={{background:"#1c1f30",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex",alignItems:"center"}}>
          <Icon name="edit" size={13} color="#8890a8"/>
        </button>
        <button onClick={onDelete} style={{background:"#2a1010",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex",alignItems:"center"}}>
          <Icon name="trash" size={13} color="#e85a5a"/>
        </button>
      </div>
    </div>
  );
}

// ─── STAT CARD ────────────────────────────────────────────────
function StatCard({ label, value, color, sub }) {
  return (
    <div style={{background:"#13162280",border:"1px solid #1c1f30",borderRadius:14,padding:"16px"}}>
      <div style={{fontSize:11,fontWeight:600,color:"#8890a8",letterSpacing:0.8,textTransform:"uppercase",marginBottom:6,lineHeight:1.3}}>{label}</div>
      <div style={{fontFamily:"Instrument Serif,serif",fontSize:26,color,lineHeight:1,marginBottom:sub?4:0}}>{value<0?`-${fmt(value)}`:fmt(value)}</div>
      {sub&&<div style={{fontSize:11,color:"#8890a8",marginTop:4}}>{sub}</div>}
    </div>
  );
}

// ─── FIELD / SETTINGS CARD ────────────────────────────────────
function Field({ label, icon, children }) {
  return (
    <div>
      <label style={{display:"block",fontSize:13,fontWeight:500,color:"#8890a8",marginBottom:8}}>{icon} {label}</label>
      {children}
    </div>
  );
}

function SettingCard({ title, children }) {
  return (
    <div style={{background:"#13162280",border:"1px solid #1c1f30",borderRadius:16,padding:18}}>
      <div style={{fontWeight:600,fontSize:14,marginBottom:12,color:"#dde1f0"}}>{title}</div>
      {children}
    </div>
  );
}

// ─── EXPENSE MODAL ────────────────────────────────────────────
function ExpenseModal({ expense, onSave, onClose }) {
  const [form, setForm] = useState(expense||{company:"",category:"Housing",amount:"",date:today(),recurring:false,paid:false,notes:""});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  return (
    <Modal title={expense?"Edit Expense":"Log Expense"} onClose={onClose}>
      <Field label="Company / Description" icon="🏷️">
        <input value={form.company} onChange={e=>set("company",e.target.value)} placeholder="e.g. Tesco, Netflix, Council Tax" autoFocus/>
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Amount (£)" icon="💷">
          <input type="number" step="0.01" value={form.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00"/>
        </Field>
        <Field label="Date" icon="📅">
          <input type="date" value={form.date} onChange={e=>set("date",e.target.value)}/>
        </Field>
      </div>
      <Field label="Category" icon="🏷️">
        <select value={form.category} onChange={e=>set("category",e.target.value)}>
          {CATEGORIES.map(c=><option key={c} value={c}>{CAT_ICON[c]} {c}</option>)}
        </select>
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Type" icon="🔁">
          <select value={form.recurring?"recurring":"oneoff"} onChange={e=>set("recurring",e.target.value==="recurring")}>
            <option value="oneoff">One-off</option>
            <option value="recurring">Recurring</option>
          </select>
        </Field>
        <Field label="Status" icon="✅">
          <select value={form.paid?"paid":"unpaid"} onChange={e=>set("paid",e.target.value==="paid")}>
            <option value="unpaid">Unpaid</option>
            <option value="paid">Already paid</option>
          </select>
        </Field>
      </div>
      <Field label="Notes (optional)" icon="📝">
        <input value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="Any extra detail…"/>
      </Field>
      <ModalButtons onSave={()=>{ if(!form.company||!form.amount) return; onSave(form); }} onClose={onClose} label={expense?"Save changes":"Log expense"}/>
    </Modal>
  );
}

// ─── INCOME MODAL ─────────────────────────────────────────────
function IncomeModal({ income, onSave, onClose }) {
  const isSalary = income?.isSalary;
  const [form, setForm] = useState(income||{label:"",amount:"",date:today(),recurring:true});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const handleSave = () => {
    if(!form.amount) return;
    if(isSalary) {
      // Salary edit — just updates salaryAmount on state directly
      onSave({...form, isSalary:true});
    } else {
      if(!form.label) return;
      onSave(form);
    }
  };

  return (
    <Modal title={isSalary?"Edit Salary":income?"Edit Income":"Add Income"} onClose={onClose}>
      {!isSalary&&(
        <Field label="Label" icon="🏷️">
          <input value={form.label} onChange={e=>set("label",e.target.value)} placeholder="e.g. Freelance, Bonus" autoFocus/>
        </Field>
      )}
      <Field label={isSalary?"Monthly salary (£)":"Amount (£)"} icon="💷">
        <input type="number" step="0.01" value={form.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00" autoFocus={isSalary}/>
      </Field>
      {!isSalary&&(
        <Field label="Date received" icon="📅">
          <input type="date" value={form.date} onChange={e=>set("date",e.target.value)}/>
        </Field>
      )}
      {!isSalary&&(
        <Field label="Type" icon="🔁">
          <select value={form.recurring?"recurring":"oneoff"} onChange={e=>set("recurring",e.target.value==="recurring")}>
            <option value="recurring">Recurring (resets each pay period)</option>
            <option value="oneoff">One-off (removed after reset)</option>
          </select>
        </Field>
      )}
      <ModalButtons onSave={handleSave} onClose={onClose} label={income?"Save changes":"Add income"}/>
    </Modal>
  );
}

// ─── MODAL WRAPPER ────────────────────────────────────────────
function Modal({ title, children, onClose }) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:"0 0 env(safe-area-inset-bottom)"}}
      onClick={onClose}>
      <div style={{background:"#13151f",border:"1px solid #1c1f30",borderRadius:"20px 20px 0 0",padding:"28px 20px 24px",width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{fontFamily:"Instrument Serif,serif",fontSize:22}}>{title}</div>
          <button onClick={onClose} style={{background:"#1c1f30",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",display:"flex",alignItems:"center"}}>
            <Icon name="x" size={16} color="#8890a8"/>
          </button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>{children}</div>
      </div>
    </div>
  );
}

function ModalButtons({ onSave, onClose, label }) {
  return (
    <div style={{display:"flex",gap:10,marginTop:6}}>
      <button onClick={onSave} style={{flex:1,background:"#6c8ef5",color:"#fff",border:"none",borderRadius:10,padding:"13px",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{label}</button>
      <button onClick={onClose} style={{background:"#1c1f30",color:"#8890a8",border:"none",borderRadius:10,padding:"13px 18px",fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
    </div>
  );
}

// ─── GLOBAL STYLES ────────────────────────────────────────────
function GlobalStyles() {
  return (
    <style>{`
      * { box-sizing: border-box; margin: 0; padding: 0; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2e45; border-radius: 2px; }
      input, select {
        background: #1c1f30 !important; color: #dde1f0 !important;
        border: 1px solid #2a2e45 !important; border-radius: 10px !important;
        padding: 11px 14px !important; font-family: 'DM Sans', sans-serif !important;
        font-size: 15px !important; width: 100% !important; outline: none !important;
        transition: border-color 0.2s, box-shadow 0.2s;
        -webkit-appearance: none; appearance: none;
      }
      input:focus, select:focus {
        border-color: #6c8ef5 !important;
        box-shadow: 0 0 0 3px rgba(108,142,245,0.15) !important;
      }
      select option { background: #1c1f30; }
      .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; display: flex; align-items: center; border-radius: 8px; transition: background 0.15s; }
      .icon-btn:hover { background: #1c1f30; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateX(-50%) translateY(8px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
    `}</style>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<BudgetPlanner/>);
</script>
</body>
</html>
